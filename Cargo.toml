[package]
name = "names"
version = "0.15.0"
authors = [
    "Fletcher Nichol <fnichol@nichol.ca>",
    "Shunichiro Nomura <nomura@space.t.u-tokyo.ac.jp>",
]
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shunichironomura/names"
documentation = "https://docs.rs/names"
homepage = "https://github.com/shunichironomura/names"
keywords = ["name", "random"]
categories = ["command-line-utilities"]
description = """
A random name generator with names suitable for use in container
instances, project names, application instances, etc.
"""

[[bin]]
name = "names"
path = "src/bin/names.rs"
required-features = ["application"]

[features]
default = ["application"]

# Required for building the `names` CLI. Should be disabled when depending on
# names as a library. For example, to use as a library in a Cargo.toml:
# `names = { version = "...", default-features = false }`
application = ["clap"]
# Enable JavaScript randomness when building for a browser or Node.js.
wasm_js = ["dep:getrandom"]
clap = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", optional = true, features = ["derive"] }
rand = "0.10"

[dev-dependencies]
version-sync = "0.9.5"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[package.metadata.docs.rs]
no-default-features = true
